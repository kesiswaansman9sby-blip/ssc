// VARIABEL GLOBAL UNTUK LIVE CLOCK SHOLAT
let clockInterval = null;

const startLoading = (text = "Memproses...") => {
    document.getElementById('loadingText').innerText = text;
    document.getElementById('loadingOverlay').style.display = 'flex';
    document.querySelectorAll('button').forEach(b => b.disabled = true);
};
const endLoading = () => {
    document.getElementById('loadingOverlay').style.display = 'none';
    document.querySelectorAll('button').forEach(b => b.disabled = false);
};

function toggleSidebar() {
    document.getElementById('sidebarMenu').classList.toggle('collapsed');
}

// ==========================================
// 1. INIT & AUTH FLOW
// ==========================================
document.addEventListener("DOMContentLoaded", () => {
    if (typeof google === 'undefined') {
        document.getElementById('previewBadge').style.display = 'block';
        if(mockDB.App_Settings.logo) applyLogo(mockDB.App_Settings.logo);
    } else {
        google.script.run
            .withSuccessHandler(res => {
                if(res.success && res.data.logo) {
                    applyLogo(res.data.logo);
                }
            })
            .getAppSettings();
    }
    checkLoginState();
});

function applyLogo(src) {
    if(src) {
        document.getElementById('mainLogoLogin').src = src;
        document.getElementById('mainLogoSidebar').src = src;
        let preview = document.getElementById('logoPreview');
        if(preview) preview.src = src;
    }
}

function checkLoginState() {
    try {
        const storedUser = localStorage.getItem('smartSchoolUser');
        if (storedUser) {
            currentUser = JSON.parse(storedUser);
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('appView').style.display = 'flex';
            
            document.getElementById('userProfileNameSide').innerText = currentUser.nama;
            document.getElementById('userProfileRoleSide').innerText = currentUser.role;
            document.getElementById('avatarInitial').innerText = currentUser.nama.charAt(0).toUpperCase();
            
            renderMenu();
            
            if (currentUser.role === 'Display Masjid') {
                loadView('sholat_dash');
                document.getElementById('sidebarMenu').classList.add('collapsed');
            } else {
                loadView('dashboard');
            }
        } else {
            document.getElementById('loginView').style.display = 'flex';
            document.getElementById('appView').style.display = 'none';
        }
    } catch (e) {
        localStorage.removeItem('smartSchoolUser');
    }
}

function handleLogin(e) {
    e.preventDefault();
    const formData = {
        username: document.getElementById('logUser').value,
        password: document.getElementById('logPass').value
    };

    startLoading("Verifikasi akun...");

    if (typeof google === 'undefined') {
        setTimeout(() => {
            endLoading();
            let found = mockDB.Users.find(u => u.username == formData.username && u.password == formData.password);
            if (!found && formData.username === 'admin') found = mockDB.Users[0]; 
            
            if (found) {
                localStorage.setItem('smartSchoolUser', JSON.stringify(found));
                document.getElementById('loginForm').reset();
                checkLoginState();
            } else {
                Swal.fire('Error', 'Username/Password salah (Simulasi)', 'error');
            }
        }, 800);
    } else {
        google.script.run
            .withSuccessHandler(res => {
                endLoading();
                if (res.success) {
                    localStorage.setItem('smartSchoolUser', JSON.stringify(res.user));
                    document.getElementById('loginForm').reset();
                    checkLoginState();
                } else {
                    Swal.fire('Gagal Login', res.message, 'error');
                }
            })
            .withFailureHandler(err => {
                endLoading();
                Swal.fire('Error System', err.message, 'error');
            })
            .loginUser(formData);
    }
}

function handleLogout() {
    Swal.fire({
        title: 'Yakin ingin keluar?', icon: 'question',
        showCancelButton: true, confirmButtonText: 'Ya, Keluar'
    }).then((result) => {
        if (result.isConfirmed) {
            if(html5QrcodeScanner) { try{ html5QrcodeScanner.clear(); }catch(e){} }
            localStorage.removeItem('smartSchoolUser');
            document.getElementById('sidebarMenu').classList.remove('collapsed');
            checkLoginState(); 
        }
    });
}

function renderMenu() {
    const container = document.getElementById('menuContainer');
    container.innerHTML = '';
    
    menus.forEach((m, index) => {
        if (m.roles.includes('All') || m.roles.includes(currentUser.role) || currentUser.role === 'Super Admin') {
            if (m.submenus) {
                let allowedSubmenus = m.submenus.filter(sub => !sub.roles || sub.roles.includes(currentUser.role) || currentUser.role === 'Super Admin');
                
                if (allowedSubmenus.length > 0) {
                    let subHtml = `<div class="collapse submenu" id="collapse-${index}">`;
                    allowedSubmenus.forEach(sub => {
                        subHtml += `<a class="nav-link" onclick="loadView('${sub.id}', 'collapse-${index}')" id="menu-${sub.id}">
                                        <i class="fa-solid fa-angle-right me-2 text-muted" style="font-size:0.8em"></i> ${sub.label}
                                    </a>`;
                    });

function handleUploadLogo() {
    const fileInput = document.getElementById('logoInput');
    if(!fileInput.files || !fileInput.files[0]) {
        Swal.fire('Perhatian', 'Pilih file gambar terlebih dahulu', 'warning');
        return;
    }
    
    const file = fileInput.files[0];
    const reader = new FileReader();
    
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 250;
            const MAX_HEIGHT = 250;
            let width = img.width;
            let height = img.height;

            if (width > height) {
                if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
                if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            const compressedDataUrl = canvas.toDataURL('image/png');
            
            startLoading('Mengunggah dan menyimpan logo...');
            
            if (typeof google === 'undefined') {
                setTimeout(() => {
                    endLoading();
                    mockDB.App_Settings.logo = compressedDataUrl;
                    applyLogo(compressedDataUrl);
                    Swal.fire('Berhasil', 'Logo berhasil diubah (Simulasi)', 'success');
                }, 800);
            } else {
                google.script.run
                    .withSuccessHandler(res => {
                        endLoading();
                        if(res.success) {
                            applyLogo(compressedDataUrl);
                            Swal.fire('Berhasil', res.message, 'success');
                        } else {
                            Swal.fire('Gagal', res.message, 'error');
                        }
                    })
                    .withFailureHandler(err => {
                        endLoading();
                        Swal.fire('Error', 'Gagal menghubungi server Google', 'error');
                    })
                    .saveAppSetting('logo', compressedDataUrl);
            }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function renderCameraScannerUI(scanType, subtitle, icon) {
    document.getElementById('mainContent').innerHTML = `

            <div class="col-md-8">

                    <p class="text-muted mb-3 small">Didukung oleh Engine Kamera Presisi Tinggi.</p>
                    
                    <div id="reader" style="width: 100%; max-width: 450px; margin: 0 auto; border-radius:12px; overflow:hidden; border: 2px solid #e5e7eb;"></div>
                    
                    <div class="alert alert-warning small mt-4 text-start mx-auto" style="max-width:450px; background:#fffbea;">
                        <strong><i class="fa-solid fa-triangle-exclamation text-warning"></i> Info & Solusi Izin Kamera:</strong><br>
                        Jika di atas muncul pesan <i class="text-danger">"NotAllowedError: Permission denied"</i>:<br>
                        1. Klik ikon <b>Gembok 🔒 / Settings</b> di bilah URL browser (di atas).<br>
                        2. Pilih opsi <b>Kamera</b>, ubah menjadi <b>Izinkan (Allow)</b>.<br>
                        3. Refresh (Muat Ulang) halaman ini.
                    </div>

                    <div id="scanResult" class="alert alert-secondary mt-4 mx-auto fw-bold" style="display:none; max-width: 450px; border-radius: 12px;"></div>
                </div>
            </div>
        </div>
    `;

    setTimeout(() => {
        html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 20, qrbox: {width: 250, height: 250}, rememberLastUsedCamera: true, aspectRatio: 1.0 }, false
        );
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }, 300);

    function onScanSuccess(decodedText, decodedResult) {
        html5QrcodeScanner.pause(true); 
        
        const resBox = document.getElementById('scanResult');
        resBox.className = "alert alert-warning mt-4 mx-auto fw-bold border-0";
        resBox.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-2"></i> Processing data...`; 
        resBox.style.display = 'block';

        if (typeof google === 'undefined') {
            setTimeout(() => {
                const siswa = mockDB.Siswa.find(s => String(s.nis).trim() === decodedText || String(s.uid).trim() === decodedText);
                if(siswa) {
                    resBox.className = "alert alert-success mt-4 mx-auto fw-bold border-0 shadow-sm";
                    resBox.innerHTML = `✅ Terdeteksi: ${siswa.nama} (${siswa.kelas})`;
                } else {
                    resBox.className = "alert alert-danger mt-4 mx-auto fw-bold border-0 shadow-sm";
                    resBox.innerHTML = `❌ Error: Kartu (NIS/UID) belum didaftarkan di Menu Data Siswa!`;
                }
                setTimeout(() => html5QrcodeScanner.resume(), 2500);
            }, 600);
        } else {
            google.script.run
                .withSuccessHandler(res => {
                    if(res.success) {
                        resBox.className = "alert alert-success mt-4 mx-auto fw-bold border-0 shadow-sm";
                        resBox.innerHTML = `✅ ${res.message}`;
                    } else {
                        if(res.isDuplicate) {
                            resBox.className = "alert alert-info mt-4 mx-auto fw-bold border-0 shadow-sm text-primary";
                            resBox.innerHTML = `${res.message}`;
                        } else {
                            resBox.className = "alert alert-danger mt-4 mx-auto fw-bold border-0 shadow-sm";
                            resBox.innerHTML = `❌ ${res.message}`;
                        }
                    }
                    setTimeout(() => html5QrcodeScanner.resume(), 2500);
                })
                .withFailureHandler(err => {
                    resBox.className = "alert alert-danger mt-4 mx-auto fw-bold border-0 shadow-sm";
                    resBox.innerHTML = `❌ Connection Error`;
                    setTimeout(() => html5QrcodeScanner.resume(), 2500);
                })
                .processTapKartu(decodedText, scanType);
        }
    }
    function onScanFailure(error) { }
}

function startLiveClockAndSession() {
    const updateDisplay = () => {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit', second:'2-digit'});
        
        const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        const dateStr = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
        
        const jamSekarang = now.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'}); 

        const dateEl = document.getElementById('liveDate');
        const clockEl = document.getElementById('liveClock');
        if(dateEl) dateEl.innerText = dateStr;
        if(clockEl) clockEl.innerText = timeStr;

        let active = sholatSchedules.find(j => jamSekarang >= j.jam_mulai && jamSekarang <= j.jam_selesai);
        
        const sessionEl = document.getElementById('activeSessionName');
        const imamEl = document.getElementById('activeImam');
        
        if(sessionEl && imamEl) {
            if(active) {
                sessionEl.innerHTML = `<span class="badge bg-success me-2">Aktif</span> ${active.nama_sesi} (${active.jam_mulai} - ${active.jam_selesai})`;
                imamEl.innerText = active.nama_imam || 'Belum diatur';
            } else {
                sessionEl.innerHTML = `<span class="badge bg-secondary me-2">Standby</span> Tidak ada sesi aktif`;
                imamEl.innerText = "-";
            }
        }
    };

    if (typeof google === 'undefined') {
        sholatSchedules = mockDB.Sholat_Jadwal;
        updateDisplay();
        clockInterval = setInterval(updateDisplay, 1000);
    } else {
        google.script.run
        .withSuccessHandler(res => {
            if(res.success) sholatSchedules = res.data;
            updateDisplay();
            clockInterval = setInterval(updateDisplay, 1000);
        })
        .getAllData('Sholat_Jadwal');
    }
}

function handleScanTap(e, type) {
    if (e.key === 'Enter') {
        e.preventDefault();
        const inputObj = document.getElementById('inputScan');
        const rfid = inputObj.value.trim();
        if(rfid === "") return;
        
        inputObj.value = ''; inputObj.disabled = true;
        const resBox = document.getElementById('scanResult');
        resBox.className = "alert alert-warning mt-4 mx-md-5 fw-bold border-0";
        resBox.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-2"></i> Processing data...`; resBox.style.display = 'block';
        
        if (typeof google === 'undefined') {
            setTimeout(() => {
                inputObj.disabled = false; inputObj.focus();
                const siswa = mockDB.Siswa.find(s => String(s.nis).trim() === rfid || String(s.uid).trim() === rfid);
                
                if(siswa) {
                    if(type === 'sholat') {
                        const d = new Date();
                        const jamSekarang = d.getHours().toString().padStart(2, '0') + ":" + d.getMinutes().toString().padStart(2, '0');
                        const tglSekarang = d.toISOString().split('T')[0];
                        const jadwalAktif = mockDB.Sholat_Jadwal.find(j => jamSekarang >= j.jam_mulai && jamSekarang <= j.jam_selesai);
                        const namaSesi = jadwalAktif ? jadwalAktif.nama_sesi : "Sesi Tidak Diketahui";
                        
                        const isDup = mockDB.Sholat_Absen.find(a => 
                            String(a.nis) === String(siswa.nis) && 
                            a.id_sesi === namaSesi && 
                            a.waktu_tap.includes(tglSekarang)
                        );

                        if(isDup) {
                            resBox.className = "alert alert-info mt-4 mx-md-5 fw-bold border-0 text-primary shadow-sm";
                            resBox.innerHTML = `⚠️ ${siswa.nama} sudah absensi untuk [${namaSesi}] hari ini.`;
                        } else {
                            mockDB.Sholat_Absen.push({id: Date.now(), nis: siswa.nis, nama: siswa.nama, kelas: siswa.kelas, id_sesi: namaSesi, waktu_tap: new Date().toISOString(), status: 'Hadir'});
                            resBox.className = "alert alert-success mt-4 mx-md-5 fw-bold border-0 shadow-sm";
                            resBox.innerHTML = `✅ Absen: ${siswa.nama} (${siswa.kelas}) - [${namaSesi}]`;
                        }
                    } else {
                         resBox.className = "alert alert-success mt-4 mx-md-5 fw-bold border-0 shadow-sm";
                         resBox.innerHTML = `✅ ${siswa.nama} (${siswa.kelas})`;
                    }
                } else {
                    resBox.className = "alert alert-danger mt-4 mx-md-5 fw-bold border-0 shadow-sm"; 
                    resBox.innerHTML = `❌ Error: Kartu (NIS/UID) belum didaftarkan di Menu Data Siswa!`;
                }
            }, 600);
        } else {
            google.script.run
                .withSuccessHandler(res => {
                    inputObj.disabled = false; inputObj.focus();
                    if(res.success) {
                        resBox.className = "alert alert-success mt-4 mx-md-5 fw-bold border-0 shadow-sm"; 
                        resBox.innerHTML = `✅ ${res.message}`;
                    } else {
                        if(res.isDuplicate) {
                            resBox.className = "alert alert-info mt-4 mx-md-5 fw-bold border-0 text-primary shadow-sm";
                            resBox.innerHTML = res.message;
                        } else {
                            resBox.className = "alert alert-danger mt-4 mx-md-5 fw-bold border-0 shadow-sm"; 
                            resBox.innerHTML = `❌ ${res.message}`;
                        }
                    }
                })
                .withFailureHandler(err => {
                    inputObj.disabled = false; inputObj.focus();
                    resBox.className = "alert alert-danger mt-4 mx-md-5 fw-bold border-0 shadow-sm"; 
                    resBox.innerHTML = `❌ Connection Error`;
                })
                .processTapKartu(rfid, type);
        }
    }
}

// ==========================================
// 4. GENERIC CRUD (TABLE & FORM)
// ==========================================
function renderGenericTable(sheetName, columns, title) {
    document.getElementById('mainContent').innerHTML = `
        <div class="inner-card mb-4 h-100 d-flex flex-column shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div>
                    <h5 class="mb-0 fw-bold text-dark">${title}</h5>
                    <small class="text-muted">Manajemen tabel: ${sheetName}</small>
                </div>
                <button class="btn btn-primary px-4 py-2" onclick="openModal('${sheetName}', '${columns.join(',')}')">
                    <i class="fa-solid fa-plus me-1"></i> Add Data
                </button>
            </div>
            <div class="table-responsive flex-grow-1" id="tableContainer">
                <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
            </div>
        </div>
    `;
    fetchData(sheetName, columns);
}

function fetchData(sheetName, columns) {
    if (typeof google === 'undefined') {
        setTimeout(() => buildTable(mockDB[sheetName] || [], columns, sheetName), 500);
    } else {
        google.script.run
            .withSuccessHandler(res => {
                if(res.success) buildTable(res.data, columns, sheetName);
                else document.getElementById('tableContainer').innerHTML = `<div class="alert alert-danger border-0">${res.message}</div>`;
            })
            .withFailureHandler(err => {
                document.getElementById('tableContainer').innerHTML = `<div class="alert alert-danger border-0">Koneksi Error</div>`;
            })
            .getAllData(sheetName);
    }
}

function buildTable(data, columns, sheetName) {
    let html = `<table class="table table-hover align-middle mb-0">
                  <thead class="bg-light"><tr>`;
    columns.forEach(col => { html += `<th>${col.toUpperCase().replace(/_/g, ' ')}</th>`; });
    html += `<th class="text-center" style="width:100px;">Aksi</th></tr></thead><tbody>`;

    if (data.length === 0) {
        html += `<tr><td colspan="${columns.length + 1}" class="text-center text-muted py-5 bg-white border-0">Belum ada data tersedia</td></tr>`;
    } else {
        data.forEach(row => {
            html += `<tr>`;
            columns.forEach(col => { html += `<td>${row[col] || '-'}</td>`; });
            const safeRow = JSON.stringify(row).replace(/'/g, "&#39;").replace(/"/g, "&quot;");
            html += `
            <td class="text-center" style="white-space:nowrap;">
                <button class="btn btn-light btn-sm shadow-sm text-primary border me-1" onclick="editData('${sheetName}', '${columns.join(',')}', '${safeRow}')"><i class="fa-solid fa-pen-to-square"></i></button>
                <button class="btn btn-light btn-sm shadow-sm text-danger border" onclick="hapusData('${sheetName}', '${row.id}')"><i class="fa-solid fa-trash-can"></i></button>
            </td></tr>`;
        });
    }
    html += `</tbody></table>`;
    document.getElementById('tableContainer').innerHTML = html;
}

// ==========================================
// 5. MODAL FORM HANDLERS
// ==========================================
function openModal(sheetName, colsStr, data = null) {
    const columns = colsStr.split(',');
    document.getElementById('modalTitle').innerText = data ? `Update ${sheetName.replace('_', ' ')}` : `New Data`;
    document.getElementById('formSheetName').value = sheetName;
    document.getElementById('formId').value = data ? data.id : '';
    
    let formHtml = '';
    columns.forEach(col => {
        let val = data ? data[col] : '';
        
        if (col === 'role') {
            formHtml += `
            <div class="mb-3">
                <label class="form-label fw-bold text-secondary small text-uppercase" style="letter-spacing:0.5px;">Hak Akses / Role</label>
                <select class="form-select bg-light border-0" name="role" required style="padding:10px 15px;">
                    <option value="">-- Pilih Role --</option>
                    <option value="Super Admin" ${val === 'Super Admin' ? 'selected' : ''}>Super Admin</option>
                    <option value="Admin Perpus" ${val === 'Admin Perpus' ? 'selected' : ''}>Admin Perpus</option>
                    <option value="Admin UKS" ${val === 'Admin UKS' ? 'selected' : ''}>Admin UKS</option>
                    <option value="Admin Sholat" ${val === 'Admin Sholat' ? 'selected' : ''}>Admin Sholat</option>
                    <option value="Admin Izin" ${val === 'Admin Izin' ? 'selected' : ''}>Admin Izin</option>
                    <option value="Display Masjid" ${val === 'Display Masjid' ? 'selected' : ''}>Display Masjid (Hanya Scanner)</option>
                    <option value="Siswa" ${val === 'Siswa' ? 'selected' : ''}>Siswa</option>
                </select>
            </div>`;
        } 
        else if (col === 'jenis_kelamin') {
            formHtml += `
            <div class="mb-3">
                <label class="form-label fw-bold text-secondary small text-uppercase" style="letter-spacing:0.5px;">Jenis Kelamin</label>
                <select class="form-select bg-light border-0" name="jenis_kelamin" required style="padding:10px 15px;">
                    <option value="">-- Pilih Gender --</option>
                    <option value="Laki-laki" ${val === 'Laki-laki' ? 'selected' : ''}>Laki-laki</option>
                    <option value="Perempuan" ${val === 'Perempuan' ? 'selected' : ''}>Perempuan</option>
                </select>
            </div>`;
        }
        else {
            let type = 'text';
            if (col.includes('password')) {
                type = 'password';
            } else if (col.includes('tgl') || col.includes('tanggal')) {
                type = 'date';
            } else if (col.includes('jam')) {
                type = 'time';
            }
            
            let placeholder = '';
            if(col === 'nama' || col === 'kelas') placeholder = 'Kosongkan jika ingin sistem auto-fill via NIS';
            if(col === 'kelas_target') placeholder = 'Contoh: XI, XII (Pisahkan dengan koma)';
            if(col === 'nama_imam') placeholder = 'Nama Imam yang bertugas';
            if(col === 'keterangan') placeholder = 'Cth: Haid / Sakit';
            
            formHtml += `
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary small text-uppercase" style="letter-spacing:0.5px;">${col.replace(/_/g, ' ')}</label>
                    <input type="${type}" class="form-control bg-light border-0" name="${col}" value="${val}" placeholder="${placeholder}" ${col === 'nama' || col === 'kelas' ? '' : 'required'} style="padding:10px 15px;">
                </div>
            `;
        }
    });
    
    document.getElementById('modalBody').innerHTML = formHtml;
    new bootstrap.Modal(document.getElementById('globalModal')).show();
}

function editData(sheetName, colsStr, rowDataStr) {
    const data = JSON.parse(rowDataStr.replace(/&quot;/g, '"').replace(/&#39;/g, "'"));
    openModal(sheetName, colsStr, data);
}

function handleFormSubmit(e) {
    e.preventDefault();
    startLoading('Menyimpan data...');
    
    const formEl = document.getElementById('globalForm');
    const formData = new FormData(formEl);
    let dataObj = {};
    formData.forEach((value, key) => { dataObj[key] = value; });
    
    const sheetName = document.getElementById('formSheetName').value;
    dataObj.id = document.getElementById('formId').value;

    if (typeof google === 'undefined') {
        setTimeout(() => {
            endLoading();
            if (dataObj.nis && (!dataObj.nama || dataObj.nama === "")) {
                const s = mockDB.Siswa.find(x => x.nis === dataObj.nis);
                if(s) { dataObj.nama = s.nama; dataObj.kelas = s.kelas; }
            }

            if(dataObj.id) {
                let idx = mockDB[sheetName].findIndex(x => x.id == dataObj.id);
                if(idx > -1) mockDB[sheetName][idx] = {...mockDB[sheetName][idx], ...dataObj};
            } else {
                dataObj.id = Date.now();
                if(!mockDB[sheetName]) mockDB[sheetName] = [];
                mockDB[sheetName].push(dataObj);
            }
            bootstrap.Modal.getInstance(document.getElementById('globalModal')).hide();
            Swal.fire('Berhasil', 'Data tersimpan di memori (Simulasi)', 'success');
            const cols = Object.keys(dataObj).filter(k => k !== 'id');
            fetchData(sheetName, cols);
        }, 800);
    } else {
        google.script.run
            .withSuccessHandler(res => {
                endLoading();
                if (res.success) {
                    bootstrap.Modal.getInstance(document.getElementById('globalModal')).hide();
                    Swal.fire('Berhasil', res.message, 'success');
                    const cols = Array.from(formData.keys()); 
                    fetchData(sheetName, cols); 
                } else {
                    Swal.fire('Gagal', res.message, 'error');
                }
            })
            .withFailureHandler(err => {
                endLoading();
                Swal.fire('Error', err.message, 'error');
            })
            .saveData(sheetName, dataObj);
    }
}

function hapusData(sheetName, id) {
    Swal.fire({
        title: 'Hapus data ini?', text: "Data tidak bisa dikembalikan!", icon: 'warning',
        showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Ya, Hapus!'
    }).then((result) => {
        if (result.isConfirmed) {
            startLoading('Menghapus data...');
            if (typeof google === 'undefined') {
                setTimeout(() => {
                    endLoading();
                    mockDB[sheetName] = mockDB[sheetName].filter(x => x.id != id);
                    Swal.fire('Terhapus', 'Data dihapus (Simulasi)', 'success');
                    loadView(currentView);
                }, 500);
            } else {
                google.script.run
                    .withSuccessHandler(res => {
                        endLoading();
                        if(res.success) {
                            Swal.fire('Terhapus', res.message, 'success');
                            loadView(currentView);
                        } else {
                            Swal.fire('Gagal', res.message, 'error');
                        }
                    })
                    .withFailureHandler(err => {
                        endLoading();
                        Swal.fire('Error', err.message, 'error');
                    })
                    .deleteData(sheetName, id);
            }
        }
    });
}
